name: Build Dictionary

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find or install Dictionary Development Kit
        run: |
          DDK=$(find /Applications/Xcode.app \
                     /Library/Developer \
                     2>/dev/null \
                     -type d -name "Dictionary Development Kit" \
                     -maxdepth 8 \
                     | head -1)

          if [ -n "$DDK" ]; then
            echo "Found DDK at: $DDK"
          else
            echo "DDK not found — cloning mirror..."
            git clone --depth 1 https://github.com/SebastianSzturo/Dictionary-Development-Kit.git /tmp/ddk
            mkdir -p "$HOME/Library/Dictionary Development Kit"
            cp -r /tmp/ddk/. "$HOME/Library/Dictionary Development Kit/"
            DDK="$HOME/Library/Dictionary Development Kit"
          fi
          echo "DDK_PATH=$DDK" >> $GITHUB_ENV

      - name: Build
        run: make DICT_BUILD_TOOL_DIR="$DDK_PATH"

      - name: Patch Info.plist for macOS 26 compatibility
        run: |
          PLIST="./objects/Scottish Slang.dictionary/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :DCSDictionaryLanguages" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :DCSDictionaryLanguages array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :DCSDictionaryLanguages:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :DCSDictionaryLanguages:0:DCSDictionaryDescriptionLanguage string en" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :DCSDictionaryLanguages:0:DCSDictionaryIndexLanguage string en" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :DCSDictionaryPreferredDataLocation" "$PLIST" 2>/dev/null || true

      - name: Package
        run: |
          cd objects
          zip -r "../Scottish Slang.dictionary.zip" "Scottish Slang.dictionary"
          echo "Size: $(du -sh '../Scottish Slang.dictionary.zip' | cut -f1)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Scottish-Slang-Dictionary
          path: "Scottish Slang.dictionary.zip"
          retention-days: 30

      - name: Create or update release with asset
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Create release if it doesn't exist, then upload asset
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --notes "Pre-built \`.dictionary\` bundle — download and unzip into \`~/Library/Dictionaries/\`

## Install
\`\`\`bash
curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash
\`\`\`" \
            2>/dev/null || true
          gh release upload "$TAG" \
            "Scottish Slang.dictionary.zip" \
            --repo "${{ github.repository }}" \
            --clobber
